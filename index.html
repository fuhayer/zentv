<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenTV Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Giriş Ekranı */
        #login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 100%); }
        .login-card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
        .login-card h1 { font-size: 26px; margin-bottom: 8px; color: #fff; }
        .login-card p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input { width: 100%; padding: 12px 16px; background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .input-group input:focus { border-color: #6366f1; }
        .btn-primary { width: 100%; padding: 12px; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; margin-top: 10px; }
        .btn-primary:hover { opacity: 0.9; }

        /* Ana Uygulama Arayüzü */
        #app-screen { display: none; height: 100vh; flex-direction: row; }
        .sidebar { width: 350px; background: #111827; border-right: 1px solid #1f2937; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #1f2937; display: flex; gap: 10px; }
        .tab-btn { flex: 1; padding: 10px; background: #1f2937; border: none; border-radius: 8px; color: #94a3b8; font-weight: 600; cursor: pointer; }
        .tab-btn.active { background: #6366f1; color: #fff; }
        .content-list { flex: 1; overflow-y: auto; padding: 10px; }
        .item-row { padding: 12px 16px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; font-size: 14px; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.15s; }
        .item-row:hover, .item-row.active { background: #1f2937; color: #fff; }

        /* Oynatıcı Alanı */
        .player-container { flex: 1; background: #000; position: relative; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; outline: none; }
        
        /* Bilgi Overlay (Çözünürlük ve Ses) */
        .stream-info-overlay { position: absolute; top: 20px; left: 20px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 12px; font-size: 13px; color: #e2e8f0; pointer-events: none; transition: opacity 0.5s; opacity: 0; z-index: 10; }
        .stream-info-overlay.visible { opacity: 1; }
        .stream-info-overlay b { color: #6366f1; }

        .error-banner { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-screen">
        <div class="login-card">
            <h1>ZenTV Portal</h1>
            <p>Xtream Codes bilgilerinizi girin</p>
            <div id="login-error" class="error-banner"></div>
            <div class="input-group">
                <label>Portal URL</label>
                <input type="text" id="url" placeholder="http://ornek.com:8080">
            </div>
            <div class="input-group">
                <label>Kullanıcı Adı</label>
                <input type="text" id="username" placeholder="Kullanıcı adınız">
            </div>
            <div class="input-group">
                <label>Şifre</label>
                <input type="password" id="password" placeholder="Şifreniz">
            </div>
            <button type="button" class="btn-primary" onclick="connectZenTV()">ZenTV'ye Bağlan</button>
        </div>
    </div>

    <!-- ANA UYGULAMA EKRANI -->
    <div id="app-screen">
        <div class="sidebar">
            <div class="sidebar-header">
                <button type="button" class="tab-btn active" id="btn-live" onclick="switchTab('live')">Canlı Yayın</button>
                <button type="button" class="tab-btn" id="btn-vod" onclick="switchTab('vod')">Filmler (VOD)</button>
            </div>
            <div class="content-list" id="content-list"></div>
        </div>
        <div class="player-container">
            <div id="streamInfo" class="stream-info-overlay">
                Çözünürlük: <b id="resVal">Hesaplanıyor...</b> | Ses Kanalı: <b id="audioVal">Stereo</b>
            </div>
            <video id="videoPlayer" controls autoplay></video>
        </div>
    </div>

    <script>
        let serverUrl = "", user = "", pass = "", currentType = "live";
        let liveChannels = [], vodMovies = [];

        async function connectZenTV() {
            serverUrl = document.getElementById('url').value.trim().replace(/\/+$/, '');
            user = document.getElementById('username').value.trim();
            pass = document.getElementById('password').value.trim();
            const errDiv = document.getElementById('login-error');

            if (!serverUrl || !user || !pass) {
                errDiv.style.display = 'block';
                errDiv.innerText = "Lütfen tüm alanları doldurun.";
                return;
            }

            try {
                const apiURL = `${serverUrl}/player_api.php?username=${user}&password=${pass}`;
                const res = await fetch(apiURL);
                const data = await res.json();
                if (data.user_info && data.user_info.auth === 1) {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('app-screen').style.display = 'flex';
                    loadContent('live');
                } else {
                    throw new Error("Giriş bilgileri geçersiz.");
                }
            } catch (e) {
                errDiv.style.display = 'block';
                errDiv.innerText = "Bağlantı kurulamadı. URL, şifre veya CORS/Mixed Content engeli olabilir.";
            }
        }

        async function loadContent(type) {
            currentType = type;
            document.getElementById('btn-live').classList.toggle('active', type === 'live');
            document.getElementById('btn-vod').classList.toggle('active', type === 'vod');
            const listEl = document.getElementById('content-list');
            listEl.innerHTML = '<div style="padding:20px; text-align:center; color:#94a3b8;">Yükleniyor...</div>';

            const action = type === 'live' ? 'get_live_streams' : 'get_vod_streams';
            try {
                const res = await fetch(`${serverUrl}/player_api.php?username=${user}&password=${pass}&action=${action}`);
                const data = await res.json();
                if (Array.isArray(data)) {
                    if (type === 'live') {
                        liveChannels = data;
                        renderList(liveChannels, 'live');
                    } else {
                        vodMovies = data;
                        renderList(vodMovies, 'vod');
                    }
                } else {
                    listEl.innerHTML = '<div style="padding:20px; text-align:center; color:#ef4444;">Veri alınamadı.</div>';
                }
            } catch (e) {
                listEl.innerHTML = '<div style="padding:20px; text-align:center; color:#ef4444;">İçerikler yüklenemedi.</div>';
            }
        }

        function renderList(items, type) {
            const listEl = document.getElementById('content-list');
            listEl.innerHTML = '';
            if (!items || items.length === 0) {
                listEl.innerHTML = '<div style="padding:20px; text-align:center; color:#94a3b8;">İçerik bulunamadı.</div>';
                return;
            }
            items.slice(0, 150).forEach(item => {
                const div = document.createElement('div');
                div.className = 'item-row';
                div.innerText = item.name || item.title;
                div.onclick = () => playItem(item, type);
                listEl.appendChild(div);
            });
        }

        function playItem(item, type) {
            const video = document.getElementById('videoPlayer');
            const url = type === 'live' 
                ? `${serverUrl}/live/${user}/${pass}/${item.stream_id}.ts`
                : `${serverUrl}/movie/${user}/${pass}/${item.stream_id}.${item.container_extension || 'mp4'}`;
            
            video.src = url;
            video.play();
            showStreamInfo(video);
        }

        function showStreamInfo(video) {
            const infoOverlay = document.getElementById('streamInfo');
            const resVal = document.getElementById('resVal');
            const audioVal = document.getElementById('audioVal');
            
            infoOverlay.classList.add('visible');

            video.onloadedmetadata = () => {
                const width = video.videoWidth || 1920;
                const height = video.videoHeight || 1080;
                resVal.innerText = `${width}x${height}`;
                
                if (video.audioTracks && video.audioTracks.length > 0) {
                    audioVal.innerText = `${video.audioTracks.length} Kanal (Multitrack)`;
                } else {
                    audioVal.innerText = width >= 1280 ? "Stereo / 2.0" : "Mono";
                }

                setTimeout(() => {
                    infoOverlay.classList.0 && infoOverlay.classList.remove('visible');
                }, 5000);
            };
        }

        function switchTab(type) {
            loadContent(type);
        }
    </script>
</body>
</html>
