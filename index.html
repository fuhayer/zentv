<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenTV - IPTV Web Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen overflow-hidden selection:bg-indigo-600 selection:text-white">

    <div id="app" class="h-full flex flex-col">
        <!-- Dinamik içerik buraya yüklenecek -->
    </div>

    <script>
        // Uygulama Durumu (State)
        let state = {
            auth: null,
            activeTab: 'live', // 'live' veya 'movies'
            categories: [],
            streams: [],
            selectedCategory: null,
            searchQuery: '',
            playingItem: null
        };

        // Sayfa yüklendiğinde oturum kontrolü
        window.onload = function() {
            const savedAuth = localStorage.getItem('zentv_auth');
            if (savedAuth) {
                try {
                    state.auth = JSON.parse(savedAuth);
                    initDashboard();
                } catch (e) {
                    localStorage.removeItem('zentv_auth');
                    renderLogin();
                }
            } else {
                renderLogin();
            }
        };

        // 1. GİRİŞ EKRANI
        function renderLogin() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="flex h-screen w-full items-center justify-center bg-slate-950 p-4">
                    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-8 shadow-2xl">
                        <div class="text-center mb-6">
                            <div class="bg-indigo-600 text-white w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-3 font-black text-xl shadow-lg shadow-indigo-600/30">ZT</div>
                            <h1 class="text-2xl font-black text-slate-100">ZenTV Portal Girişi</h1>
                            <p class="text-xs text-slate-400 mt-1">Xtream Codes bilgilerinizi girin</p>
                        </div>
                        <div id="errorBox" class="hidden mb-4 bg-rose-500/10 border border-rose-500/20 rounded-xl p-3 text-rose-400 text-xs text-center"></div>
                        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Portal URL</label>
                                <input type="text" id="serverUrl" placeholder="http://sizinpanel.com:8080" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500" required />
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Kullanıcı Adı</label>
                                <input type="text" id="username" placeholder="Kullanıcı adınız" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500" required />
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Şifre</label>
                                <input type="password" id="password" placeholder="Şifreniz" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500" required />
                            </div>
                            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center mt-4">
                                ZenTV'ye Bağlan
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const serverUrl = document.getElementById('serverUrl').value.replace(/\/$/, '');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');
            const submitBtn = document.getElementById('submitBtn');

            errorBox.classList.add('hidden');
            submitBtn.innerText = 'Bağlanıyor...';

            const apiEndpoint = `${serverUrl}/player_api.php?username=${username}&password=${password}`;

            try {
                const res = await fetch(apiEndpoint);
                const data = await res.json();
                if (data.user_info && data.user_info.auth === 1) {
                    state.auth = { serverUrl, username, password, userInfo: data.user_info };
                    localStorage.setItem('zentv_auth', JSON.stringify(state.auth));
                    initDashboard();
                } else {
                    showError('Giriş başarısız: Kullanıcı adı, şifre veya URL hatalı.');
                }
            } catch (err) {
                showError('Bağlantı kurulamadı. Safari CORS ayarının aktif olduğundan emin olun.');
            } finally {
                submitBtn.innerText = "ZenTV'ye Bağlan";
            }
        }

        function showError(msg) {
            const errorBox = document.getElementById('errorBox');
            if (errorBox) {
                errorBox.innerText = msg;
                errorBox.classList.remove('hidden');
            }
        }

        // 2. DASHBOARD YÜKLEME VE VERİ ÇEKME
        async function initDashboard() {
            renderDashboardShell();
            await loadContent();
        }

        function renderDashboardShell() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="flex h-screen w-full overflow-hidden">
                    <!-- SİNİR / SOL MENÜ -->
                    <aside class="w-72 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4 z-10 shadow-2xl">
                        <div>
                            <div class="flex items-center gap-3 px-2 mb-8">
                                <div class="bg-indigo-600 p-2.5 rounded-2xl text-white font-black text-xl">ZT</div>
                                <span class="text-2xl font-bold tracking-wider bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">ZenTV</span>
                            </div>
                            <nav class="space-y-2">
                                <button onclick="switchTab('live')" id="tabLive" class="flex items-center gap-3 w-full px-4 py-3.5 rounded-xl font-semibold text-sm transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-600/30">Canlı TV</button>
                                <button onclick="switchTab('movies')" id="tabMovies" class="flex items-center gap-3 w-full px-4 py-3.5 rounded-xl font-semibold text-sm transition-all text-slate-400 hover:bg-slate-800 hover:text-slate-200">Filmler (VOD)</button>
                            </nav>
                        </div>
                        <div class="pt-4 border-t border-slate-800">
                            <button onclick="logout()" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl text-rose-400 hover:bg-rose-500/10 transition-colors font-medium text-sm">
                                Çıkış Yap
                            </button>
                        </div>
                    </aside>

                    <!-- ORTA ALAN: KATEGORİ + İÇERİK -->
                    <main class="flex-1 flex overflow-hidden bg-slate-950">
                        <!-- KATEGORİLER -->
                        <div class="w-80 border-r border-slate-800 bg-slate-900/40 flex flex-col">
                            <div class="p-4 border-b border-slate-800 font-bold text-sm text-slate-300" id="catHeader">Kategoriler</div>
                            <div id="categoryList" class="flex-1 overflow-y-auto p-2 space-y-1">
                                <div class="p-4 text-slate-500 text-sm text-center">Yükleniyor...</div>
                            </div>
                        </div>

                        <!-- İÇERİK LİSTESİ -->
                        <div class="flex-1 flex flex-col overflow-hidden bg-slate-950">
                            <div class="p-6 border-b border-slate-800 flex items-center justify-between">
                                <h2 class="text-2xl font-black" id="contentTitle">Yayınlar</h2>
                                <input type="text" id="searchInput" oninput="handleSearch(event)" placeholder="Kanal veya film ara..." class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 w-80" />
                            </div>
                            <div id="streamGrid" class="flex-1 overflow-y-auto p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                <div class="col-span-full text-center text-slate-500 py-12">Veriler yükleniyor...</div>
                            </div>
                        </div>
                    </main>
                </div>
                <div id="playerModalContainer"></div>
            `;
        }

        async function switchTab(tab) {
            state.activeTab = tab;
            state.selectedCategory = null;
            state.searchQuery = '';
            
            document.getElementById('tabLive').className = tab === 'live' 
                ? 'flex items-center gap-3 w-full px-4 py-3.5 rounded-xl font-semibold text-sm transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' 
                : 'flex items-center gap-3 w-full px-4 py-3.5 rounded-xl font-semibold text-sm transition-all text-slate-400 hover:bg-slate-800 hover:text-slate-200';

            document.getElementById('tabMovies').className = tab === 'movies' 
                ? 'flex items-center gap-3 w-full px-4 py-3.5 rounded-xl font-semibold text-sm transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' 
                : 'flex items-center gap-3 w-full px-4 py-3.5 rounded-xl font-semibold text-sm transition-all text-slate-400 hover:bg-slate-800 hover:text-slate-200';

            await loadContent();
        }

        async function loadContent() {
            const { serverUrl, username, password } = state.auth;
            const creds = `username=${username}&password=${password}`;
            const actionCat = state.activeTab === 'live' ? 'get_live_categories' : 'get_vod_categories';
            const actionStream = state.activeTab === 'live' ? 'get_live_streams' : 'get_vod_streams';

            document.getElementById('categoryList').innerHTML = '<div class="p-4 text-slate-500 text-sm text-center">Yükleniyor...</div>';
            document.getElementById('streamGrid').innerHTML = '<div class="col-span-full text-center text-slate-500 py-12">Yükleniyor...</div>';

            try {
                const [catRes, streamRes] = await Promise.all([
                    fetch(`${serverUrl}/player_api.php?${creds}&action=${actionCat}`),
                    fetch(`${serverUrl}/player_api.php?${creds}&action=${actionStream}`)
                ]);
                const catData = await catRes.json();
                const streamData = await streamRes.json();

                state.categories = Array.isArray(catData) ? catData : [];
                state.streams = Array.isArray(streamData) ? streamData : [];

                if (state.categories.length > 0) {
                    state.selectedCategory = state.categories[0].category_id;
                }

                renderCategories();
                renderStreams();
            } catch (err) {
                console.error(err);
                showError('Veriler sunucudan alınamadı.');
            }
        }

        function renderCategories() {
            const container = document.getElementById('categoryList');
            document.getElementById('catHeader').innerText = state.activeTab === 'live' ? `Kategoriler (${state.categories.length})` : `Film Kategorileri (${state.categories.length})`;
            
            if (state.categories.length === 0) {
                container.innerHTML = '<div class="p-4 text-slate-500 text-xs">Kategori bulunamadı.</div>';
                return;
            }

            container.innerHTML = state.categories.map(cat => {
                const isSelected = state.selectedCategory === cat.category_id;
                return `
                    <button onclick="selectCategory('${cat.category_id}')" class="w-full text-left px-4 py-3 rounded-xl text-sm font-semibold transition-all truncate ${isSelected ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}">
                        ${cat.category_name}
                    </button>
                `;
            }).join('');
        }

        function selectCategory(catId) {
            state.selectedCategory = catId;
            renderCategories();
            renderStreams();
        }

        function handleSearch(e) {
            state.searchQuery = e.target.value;
            renderStreams();
        }

        function renderStreams() {
            const container = document.getElementById('streamGrid');
            const titleEl = document.getElementById('contentTitle');

            const filtered = state.streams.filter(item => {
                const matchCat = state.selectedCategory ? item.category_id === state.selectedCategory : true;
                const matchSearch = item.name.toLowerCase().includes(state.searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            titleEl.innerText = `${state.activeTab === 'live' ? 'Canlı Yayınlar' : 'Filmler'} (${filtered.length})`;

            if (filtered.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center text-slate-500 py-12">İçerik bulunamadı.</div>';
                return;
            }

            if (state.activeTab === 'live') {
                container.className = "flex-1 overflow-y-auto p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4";
                container.innerHTML = filtered.map(ch => `
                    <div onclick='openPlayer(${JSON.stringify(ch).replace(/'/g, "&#39;")}, "live")' class="bg-slate-900 border border-slate-800 rounded-2xl p-4 hover:border-indigo-500 transition-all cursor-pointer group flex flex-col justify-between shadow-lg">
                        <div class="h-28 bg-slate-950 rounded-xl mb-3 flex items-center justify-center relative overflow-hidden border border-slate-800">
                            ${ch.stream_icon ? `<img src="${ch.stream_icon}" alt="" class="max-h-20 max-w-[80%] object-contain" onerror="this.style.display='none'" />` : '<span class="text-xs text-slate-600">Logo Yok</span>'}
                        </div>
                        <h3 class="font-bold text-slate-200 text-sm truncate">${ch.name}</h3>
                    </div>
                `).join('');
            } else {
                container.className = "flex-1 overflow-y-auto p-6 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6";
                container.innerHTML = filtered.map(item => `
                    <div onclick='openPlayer(${JSON.stringify(item).replace(/'/g, "&#39;")}, "movie")' class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-indigo-500 transition-all cursor-pointer group flex flex-col justify-between shadow-lg">
                        <div class="aspect-[2/3] bg-slate-950 relative overflow-hidden flex items-center justify-center">
                            ${item.stream_icon ? `<img src="${item.stream_icon}" alt="" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/300x450/1e1939/ffffff?text=Yok'" />` : '<span class="text-xs text-slate-600">Afiş Yok</span>'}
                        </div>
                        <div class="p-3.5"><h3 class="font-bold text-slate-200 text-xs truncate">${item.name}</h3></div>
                    </div>
                `).join('');
            }
        }

        // 3. VİDEO OYNATICI MODALI
        function openPlayer(item, type) {
            const { serverUrl, username, password } = state.auth;
            const base = serverUrl.replace(/\/$/, '');
            const streamUrl = type === 'live' 
                ? `${base}/live/${username}/${password}/${item.stream_id}.ts`
                : `${base}/movie/${username}/${password}/${item.stream_id}.${item.container_extension || 'mp4'}`;

            const modalContainer = document.getElementById('playerModalContainer');
            modalContainer.innerHTML = `
                <div class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
                    <div class="bg-slate-900 border border-slate-800 w-full max-w-4xl rounded-3xl overflow-hidden shadow-2xl flex flex-col">
                        <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950">
                            <h3 class="font-bold text-slate-100 text-base truncate">${item.name}</h3>
                            <button onclick="closePlayer()" class="text-slate-400 hover:text-white bg-slate-800 px-4 py-2 rounded-xl text-sm font-semibold">Kapat</button>
                        </div>
                        <div class="relative aspect-video bg-black flex items-center justify-center">
                            <video id="activeVideoPlayer" controls autoplay class="w-full h-full object-contain">
                                <source src="${streamUrl}" type="video/mp4">
                                Tarayıcınız video oynatmayı desteklemiyor.
                            </video>
                        </div>
                    </div>
                </div>
            `;

            const vid = document.getElementById('activeVideoPlayer');
            vid.src = streamUrl;
            vid.play().catch(err => console.log("Oynatma uyarısı:", err));
        }

        function closePlayer() {
            const modalContainer = document.getElementById('playerModalContainer');
            const vid = document.getElementById('activeVideoPlayer');
            if (vid) vid.pause();
            modalContainer.innerHTML = '';
        }

        function logout() {
            localStorage.removeItem('zentv_auth');
            state.auth = null;
            renderLogin();
        }
    </script>
</body>
</html>
